<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Addition Calculator</title>
</head>
<body>
    <script>
        let a = prompt("a = ?");
        let b = prompt("b = ?");

        a = Number(a);
        b = Number(b);

        document.write("The sum is: " + (a + b));
    </script>
</body>
</html>
